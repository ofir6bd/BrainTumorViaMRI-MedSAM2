# MedSAM2_Finetune — teach MedSAM2 to fix a YOLO guess, slice by slice, with the neighbours
# in memory.
#
# The stack of slices is a video in which EVERY slice is prompted with YOLO's own map for
# that slice. The anchor (the most confident slice) is segmented on its own; two passes then
# run away from it, up and down, and every later slice sees its hint AND the memory of the
# slices already passed. The expert segmentation is only ever the target of the loss.
# The UI shows this file as-is and a run may override the keys listed in routes.EDITABLE
# (the run keeps its own copy in runs/<run>/run_config.yaml).

model:
  checkpoint: MedSAM2_latest.pt          # read from MedSAM2/checkpoints/ (never written to)
  config: configs/sam2.1_hiera_t512.yaml # the vendored SAM2 config that matches it
  image_size: 512                        # what that config was trained at
  use_mask_input_as_output_without_sam: false
                          # SAM2's own config turns this ON: "a slice with a mask prompt gets
                          # the prompt back as its answer, the decoder never runs". Right when
                          # a person drew the mask, wrong for a YOLO guess — with it on, every
                          # slice here would simply be YOLO. Measured on BraTS-GLI-00008-101
                          # z=70: the output was the prompt pixel-for-pixel and scored 0.33
                          # Dice where YOLO's own mask scored 0.76.

prompt:
  yolo_run: 20260923-224333  # which YOLO_finetune run makes the prompts ("" = the best-scoring one).
                          #   Pinned: its prompt cache exists and every earlier run used it, so
                          #   scores stay comparable (test 0.8776; the newest, 20260927-010028,
                          #   scores 0.8781 — within noise, and would need all 1,290 rebuilt).
  variant: max            # max | max_weighted | conf_filtered — which cached map is the hint
  yolo_conf: 0.05         # blobs below this confidence are never produced
  score_min: 0.25         # conf_filtered: drop blobs below this confidence. It also sets YOLO's
                          #   own mask — the answer MedSAM2 is scored against.
  logit_scale: 8.0        # multiply YOLO's logits before handing them to MedSAM2. YOLO's reach
                          #   about +-5.5; SAM2's mask prompt barely reacts to them raw
                          #   (untrained checkpoint, 4 val patients: scale 1 -> 0.379 Dice,
                          #   4 -> 0.726, 8 -> 0.757, 12 -> 0.760).
  empty_logit: -8.0       # what a slice YOLO left empty is prompted with (a confident "nothing")
  clip_to_head: true      # silence the hint where the frame has no head in it (a 0.05 YOLO blob
                          #   can be a near-random box: 1184 of 1669 px outside the skull on
                          #   BraTS-GLI-00008-101 z=70). Read at prompt time, no cache rebuild.

augment:                  # training only: make some hints WORSE than YOLO's, so the model learns
                          # to fix a hint rather than copy it (the target is still the expert).
  p: 0.3                  # share of training frames whose hint is changed at all.
                          #   Measured (10-round screens, all 245 val patients): 0.3 -> 0.8861,
                          #   0 -> 0.8859 — a tie (paired difference 0.0002 +- 0.0016). Kept on:
                          #   it costs nothing and guards the longer runs against copying.
  drop_blob: 1.0          # relative odds of each kind of damage, among the changed frames:
  drop_slice: 0.5         #   drop one blob / blank the whole slice (YOLO missed it)
  grow: 1.0               #   outline grown / shrunk by a 3..morph_max px grey dilation/erosion
  shrink: 1.0
  shift: 0.5              #   whole map moved up to shift_max px
  cut: 1.0                #   the other confidence cut (prob <-> prob_f): a low-confidence blob
                          #   added or taken away
  morph_max: 7
  shift_max: 4

data:
  train_pool: medsam2_train   # pools are keys of the project config.yaml -> paths
  val_pool: medsam2_val       #   YOLO trained on yolo_*, so it has never seen these patients
  test_pool: test
  min_fg_voxels: 100          # a slice needs this much brain to be used at all
  max_train_patients: null    # patients per round from train_pool (null = all 721)
  val_patients: 80            # patients in the after-every-round check (null = all).
                              #   At 40 the check wandered by about +-0.01 round to round, and
                              #   all three 10-round screens "peaked" at round 4 — 80 halves
                              #   the variance of the pick, for ~5 extra minutes a round.
  clips_per_patient: 3        # training clips taken from each patient each round
  tumour_clip_fraction: 0.8   # share of those clips that start on a slice YOLO found tumour on

video:
  num_frames: 8               # slices in a training clip: the anchor plus 7 with memory
  reverse_fraction: 0.5       # share of clips fed in descending z — the downward pass
  batch: 2                    # clips per step

train:
  epochs: 15                  # every 10-round screen was flat from round 4 on (check within
                              #   +-0.005); 15 gives the cosine schedule room without waste
  patience: 8                 # the check wanders: do not stop on noise
  accum: 2                    # batches added up before a correction (effective = batch * accum)
  lr: 1.0e-4                  # AdamW, for the mask decoder and the prompt encoder
  memory_lr: 1.0e-5           # the memory moves 10x slower: a big step there disturbs every slice.
                              #   SurgSAM-2 uses exactly this ratio (2e-4 / 2e-5).
  vision_lr: 1.0e-6           # the image encoder, used only when unfreeze = all
  weight_decay: 0.01
  unfreeze: all           # decoder | decoder+prompt | decoder+prompt+memory | all
                          #   Measured (10-round screens, 245 val patients): all -> 0.8864,
                          #   helped 183 / hurt 10; decoder+prompt+memory -> 0.8861, 172 / 14.
                          #   A tie on the mean; `all` helps more patients and costs ~10% time.
  dice_weight: 1.0            # loss = dice_weight * Dice loss + bce_weight * BCE, over every frame
  bce_weight: 1.0
  iou_weight: 0.05            # keeps SAM2's own quality head honest
  obj_weight: 0.1             # teaches its object head "is there any tumour on this slice"
  fliplr: 0.5                 # left-right flip, applied to frame, hint and target together
  amp: true                   # bfloat16 mixed precision
  workers: 4
  seed: 42
  device: 0                   # the RTX 5090

evaluate:
  mask_threshold: 0.0         # the output is a logit map; > this is tumour (0 = p > 0.5).
                              #   Chosen on val (-0.5 -> 0.8896, 0 -> 0.8898, 0.5 -> 0.8892),
                              #   never on test.
  tta_flip: true              # also run the left-right mirrored patient and average the two
                              #   (same batch, so nearly free). Val: +0.0004.
  min_component: 100          # drop 3D pieces smaller than this many voxels (0 = keep all).
                              #   Val, final model: 0 -> 0.8898, 100 -> 0.8903, 200 -> 0.8899,
                              #   500 -> 0.8871, 1000 -> 0.8873 — big cuts delete real small
                              #   tumours. 100 sits on the flat part. Cutting what lies far from
                              #   YOLO's 3D mask gave nothing (0.8898 at 10 px / 5 slices).
  use_obj_score: false        # a slice whose object head says "nothing here" is left empty
  sweep: [-2, -1, -0.5, 0, 0.5, 1, 2]   # thresholds tried on val and test
