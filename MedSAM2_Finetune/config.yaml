# MedSAM2_Finetune — teach MedSAM2 to turn a YOLO guess into a clean tumour outline,
# the way SAM2 is meant to be used: the stack of slices is a *video*.
#
# A few slices (the anchors) get a prompt built from YOLO's per-voxel probability; the rest
# of the volume is reached by propagating through SAM2's memory, forwards and backwards.
# The expert segmentation is only ever the target of the loss, never a prompt.
# The UI shows this file as-is and a run may override the keys listed in routes.EDITABLE
# (the run keeps its own copy in runs/<run>/run_config.yaml).

model:
  checkpoint: MedSAM2_latest.pt          # read from MedSAM2/checkpoints/ (never written to)
  config: configs/sam2.1_hiera_t512.yaml # the vendored SAM2 config that matches it
  image_size: 512                        # what that config was trained at
  use_mask_input_as_output_without_sam: false
                          # SAM2's own config turns this ON. It means "if a slice was given a
                          # mask prompt, hand that mask straight back as the answer, without
                          # running the prompt encoder or the mask decoder" — which is right
                          # when a person drew the mask, because then the prompt IS the truth.
                          # Ours is a YOLO guess, so with it on the anchor slices were never
                          # segmented at all: measured on BraTS-GLI-00008-101 z=70, the output
                          # was the prompt pixel-for-pixel (99.8% identical, 1721 px of which
                          # 1183 were outside the head) and the anchor scored 0.33 Dice while
                          # YOLO's own mask scored 0.76. Off = the anchor is segmented like
                          # every other slice. Runs made before 2026-09-23 have no such key
                          # and replay with SAM2's default (on), the way they actually ran.

prompt:
  yolo_run: ""            # which YOLO_finetune run makes the prompts ("" = the best-scoring one)
  variant: max            # max | max_weighted | conf_filtered | binary | box | none
  yolo_conf: 0.05         # blobs below this confidence are never produced
  score_min: 0.25         # conf_filtered / box: drop blobs whose confidence is below this
  logit_scale: 8.0        # multiply YOLO's logits before handing them to MedSAM2.
                          #   YOLO's logits reach about +-5.5; SAM2's mask prompt was trained on a
                          #   wider scale, so it barely reacts to them raw. Measured on 4 val
                          #   patients with the untrained checkpoint: scale 1 -> 0.379 Dice,
                          #   2 -> 0.627, 4 -> 0.726, 8 -> 0.757, 12 -> 0.760 (the prompt itself
                          #   scores 0.819). 8 is where it stops mattering.
  empty_logit: -8.0       # what a slice YOLO left empty is prompted with (a confident "nothing")
  clip_to_head: true      # silence the prompt where the frame has no head in it. At yolo_conf
                          #   0.05 YOLO sometimes returns a near-random box: on
                          #   BraTS-GLI-00008-101 z=70 a 0.050 blob covered 1669 px, 1184 of
                          #   them outside the skull. A voxel counts as head if any channel is
                          #   non-zero, which excludes 4 of 734,193 expert tumour voxels over
                          #   10 val patients. Read at prompt time, so changing it needs no
                          #   cache rebuild.

anchors:                  # which slices are prompted; everything else is reached by memory
                          # The first anchor is the slice with the most confident tumour area
                          #   (area x score) — the automatic stand-in for "the slice a
                          #   radiologist would start on". Two other rules were tried and
                          #   dropped: on three test patients at 5 rounds all three landed
                          #   within 0.0018 of each other, so it was not worth a setting.
  count: 1                # anchors the first round starts from. Measured: starting with 3 is
                          #   WORSE than 1 (0.8056 vs 0.8194 over three test patients) — three
                          #   chosen up front crowd the same confident region, while the
                          #   correction rounds place each new one where the answer is wrong.
  min_gap: 5              # slices that must separate two anchors

hitl:                     # extra anchors added round by round (the loop 05_infer_multibbox_hitl had)
  rounds: 15              # every patient runs this many rounds, unless the anchors run out of
                          #   room (anchors.min_gap). 1 = no extra anchors. Each round is a full
                          #   forward+backward pass, so this is the main cost of scoring:
                          #   roughly 4 s per round per patient.
                          # The answer kept is the one after the LAST round. Which round count is
                          #   actually best is read off the check pool — `summary[split].best_round`
                          #   and the "Score after each round" chart — and then set here, the same
                          #   way `evaluate.mask_threshold` is chosen. Picking the best round per
                          #   patient by its Dice would mean reading the expert mask at inference,
                          #   which is the oracle this folder deliberately does not have.
                          # The next anchor always goes where the prediction disagrees most with
                          #   YOLO. Nothing here ever reads the expert mask.

data:
  train_pool: medsam2_train   # pools are keys of the project config.yaml -> paths
  val_pool: medsam2_val       #   YOLO trained on yolo_*, so it has never seen these patients
  test_pool: test
  min_fg_voxels: 100          # a slice needs this much brain to be used at all
  max_train_patients: 300     # patients per round from train_pool (null = all 721)
  val_patients: 40            # patients in the after-every-round check (null = all).
                              #   A check is a full propagation per patient, so keep it small.
  clips_per_patient: 4        # training clips taken from each patient each round
  tumour_clip_fraction: 0.8   # share of those clips that must contain tumour

video:
  num_frames: 8               # slices in a training clip: the anchor plus 7 propagated ones
  reverse_fraction: 0.5       # share of clips fed in descending z, so the model also learns to
                              #   propagate backwards — which is what inference does below the anchor
  batch: 1                    # clips per step (a clip is already num_frames forward passes)

train:
  epochs: 30                  # the first run's loss was still falling and its best check was
                              #   round 19 of 20, with the cosine schedule already at lr 0
  patience: 8                 # the 40-patient check wanders by about +-0.01, so rounds within
                              #   a point of each other are noise: do not stop on it
  accum: 4                    # clips added up before a correction (effective batch = batch * accum)
  lr: 1.0e-4                  # AdamW, for the mask decoder and the prompt encoder
  memory_lr: 1.0e-5           # the memory moves 10x slower: it carries the answer between
                              #   slices, so a big step there disturbs every slice nobody
                              #   prompted. SurgSAM-2 uses exactly this ratio (2e-4 / 2e-5);
                              #   Medical SAM 2 goes further still (1e-4 / 1e-8).
  vision_lr: 1.0e-5           # lower rate for the image encoder, used only when unfreeze = all
  weight_decay: 0.01
  unfreeze: decoder+prompt+memory   # decoder | decoder+prompt | decoder+prompt+memory | all
  dice_weight: 1.0            # loss = dice_weight * Dice loss + bce_weight * BCE, over every frame
  bce_weight: 1.0
  iou_weight: 0.05            # keeps SAM2's own quality head honest
  obj_weight: 0.1             # teaches its object head "is there any tumour on this slice"
  fliplr: 0.5                 # left-right flip, applied to frame, prompt and target together
  amp: true                   # bfloat16 mixed precision
  workers: 4
  seed: 42
  device: 0                   # the RTX 5090

evaluate:
  mask_threshold: 0.0         # the propagated output is a logit map; > this is tumour (0 = p > 0.5)
  use_obj_score: false        # a slice whose object head says "nothing here" is left empty.
                              #   Off by default: measured on the 2D run it moved 3D Dice by +0.0001
                              #   while costing sensitivity — the false alarms are confident, not leaks.
  sweep: [-4, -3, -2, -1, -0.5, 0, 0.5, 1, 2, 3, 4]   # thresholds tried on val and test
